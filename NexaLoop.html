<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NexaLoop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#070707;color:#fff}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:250px;height:100vh;position:fixed;left:0;top:0;padding:22px 16px;border-right:1px solid #222;background:#090909;display:flex;flex-direction:column;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;margin-bottom:28px;padding:8px}
.logoMark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#755cff,#c867ff)}
.logo span{background:linear-gradient(90deg,#967dff,#c878ff);-webkit-background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{border:0;background:none;color:#888;padding:13px;border-radius:12px;text-align:left}
.nav button:hover,.nav button.active{background:#181818;color:#fff}
.create,.ai{margin-top:22px;padding:13px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,#755cff,#a95fff);font-weight:bold}
.ai{margin-top:9px;background:#181818;border:1px solid #292929}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px}
.user small{display:block;color:#666}
.main{margin-left:250px;width:680px;min-height:100vh;border-right:1px solid #222}
.avatar{width:44px;height:44px;min-width:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#755cff,#ce67ff);font-weight:bold}
.top{padding:25px 20px 18px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.top p{color:#666;margin-top:5px;font-size:14px}
.stories{display:flex;gap:16px;overflow:auto;padding:17px 20px;border-bottom:1px solid #222}
.story{min-width:60px;text-align:center;color:#888;font-size:12px}
.circle{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#191919;border:2px solid #333;margin-bottom:6px}
.circle.g{background:linear-gradient(135deg,#755cff,#ce67ff);color:white;font-weight:bold}
.composer{display:flex;gap:10px;align-items:center;padding:18px 20px;border-bottom:1px solid #222;cursor:pointer}
.composer div:nth-child(2){flex:1;background:#151515;color:#666;border-radius:25px;padding:12px 16px}
.post{padding:20px;border-bottom:1px solid #222}
.posthead{display:flex;gap:10px;align-items:center}
.postuser{flex:1}.postuser span{display:block;color:#666;font-size:13px;margin-top:3px}
.posttext{margin:16px 0;line-height:1.5}.postimg{width:100%;border-radius:14px;max-height:500px;object-fit:cover}
.stats{display:flex;justify-content:space-between;color:#666;font-size:13px;padding:12px 0}
.actions{border-top:1px solid #222;display:grid;grid-template-columns:repeat(3,1fr)}
.actions button{background:none;border:0;color:#888;padding:11px}.actions button:hover{color:#fff}.actions .liked{color:#ff6688}
.page{padding:28px 24px}
.search{margin:20px 0;background:#151515;border:1px solid #292929;padding:12px;border-radius:12px}
.search input{width:100%;background:none;border:0;outline:0;color:white}
.result,.notice{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #222}
.result .info,.notice .info{flex:1}.info span{display:block;color:#666;font-size:13px;margin-top:3px}
.follow,.edit{border:1px solid #444;background:#181818;color:#fff;border-radius:9px;padding:8px 13px}
.messages{height:100vh;display:grid;grid-template-columns:270px 1fr}
.list{border-right:1px solid #222}.list h2{padding:25px 18px}.conversation{width:100%;display:flex;gap:10px;text-align:left;padding:14px;background:none;color:white;border:0}.conversation:hover,.conversation.selected{background:#171717}.conversation span{display:block;color:#666;font-size:13px;margin-top:4px}
.chat{display:flex;flex-direction:column}.chathead{padding:15px;border-bottom:1px solid #222;display:flex;gap:10px;align-items:center}.chathead span{display:block;color:#666;font-size:12px}.chatbody{flex:1;padding:25px;display:flex;flex-direction:column;gap:10px}.bubble{padding:11px 14px;border-radius:17px;max-width:70%}.received{background:#191919;align-self:flex-start}.sent{background:#765cff;align-self:flex-end}.chatinput{margin:15px;padding:8px;background:#151515;border:1px solid #292929;border-radius:13px;display:flex}.chatinput input{flex:1;background:none;border:0;outline:0;color:#fff}.chatinput button{background:none;border:0;color:#9a82ff}
.cover{height:180px;background:linear-gradient(135deg,#282052,#713d78,#151515)}.profile{padding:0 24px 22px}.profilepic{width:105px;height:105px;margin-top:-52px;border:5px solid #070707;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#755cff,#ce67ff);font-size:36px;font-weight:bold}.profile h1{margin-top:12px}.muted{color:#666}.bio{margin-top:14px;color:#bbb}.stats2{display:flex;gap:35px;margin-top:20px}.stats2 span{display:block;color:#666;font-size:13px;margin-top:3px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid #222}.tabs button{padding:15px;background:none;border:0;color:#888}.tabs button:first-child{color:#fff;border-bottom:2px solid #967cff}
.setting{width:100%;display:flex;justify-content:space-between;text-align:left;background:none;color:#fff;border:0;border-bottom:1px solid #222;padding:18px 4px}.setting span{display:block;color:#666;margin-top:4px}.logout{margin-top:25px;padding:12px;border:1px solid #542c38;background:none;color:#ff7293;border-radius:10px}
.empty{text-align:center;padding:80px 20px;color:#666}
.overlay{position:fixed;inset:0;background:#000b;backdrop-filter:blur(7px);display:grid;place-items:center;z-index:20;padding:20px}.modal{width:min(550px,100%);background:#101010;border:1px solid #292929;border-radius:18px}.modalhead{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #292929}.modal button.close{background:none;border:0;color:#fff}.createuser{display:flex;gap:10px;padding:18px}.createuser span{display:block;color:#666;font-size:13px}.modal textarea{width:100%;height:150px;background:none;border:0;outline:0;color:white;padding:0 18px;font-size:18px;resize:none}.publish{margin:15px;width:calc(100% - 30px);padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#755cff,#a95fff);color:white;font-weight:bold}
.aiMessages{height:320px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.aib{padding:10px 13px;border-radius:15px;max-width:80%}.aib.ai{background:#1b1b1b;align-self:flex-start}.aib.you{background:#765cff;align-self:flex-end}.aiinput{margin:15px;display:flex;background:#151515;border:1px solid #292929;border-radius:12px;padding:7px}.aiinput input{flex:1;background:none;border:0;outline:0;color:white}.aiinput button{border:0;background:none;color:#a08aff}
@media(max-width:750px){.sidebar{width:65px;padding:12px 7px}.logo{justify-content:center}.logoText,.nav span,.create,.ai,.user div:nth-child(2){display:none}.nav button{text-align:center}.user{justify-content:center}.main{margin-left:65px;width:calc(100% - 65px)}}
@media(max-width:550px){.sidebar{top:auto;bottom:0;width:100%;height:62px;min-height:62px;flex-direction:row;border-right:0;border-top:1px solid #222;padding:3px}.logo,.user{display:none}.nav{width:100%;flex-direction:row;justify-content:space-around}.nav button{padding:10px}.main{margin:0 0 62px;width:100%;border:0}.messages{grid-template-columns:1fr}.chat{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo"><div class="logoMark">N</div><div class="logoText">Nexa<span>Loop</span></div></div>
<div class="nav">
<button id="n-flow" class="active" onclick="page('flow')">🏠 <span>Flow</span></button>
<button id="n-search" onclick="page('search')">🔎 <span>Search</span></button>
<button id="n-messages" onclick="page('messages')">💬 <span>Nexa-Link</span></button>
<button id="n-notifications" onclick="page('notifications')">🔔 <span>Notifications</span></button>
<button id="n-saved" onclick="page('saved')">🔖 <span>Saved</span></button>
<button id="n-profile" onclick="page('profile')">👤 <span>Profile</span></button>
<button id="n-settings" onclick="page('settings')">⚙️ <span>Settings</span></button>
</div>
<button class="create" onclick="openCreate()">＋ Create</button>
<button class="ai" onclick="openAI()">✨ Nexa AI</button>
<div class="user"><div class="avatar">Y</div><div><b>You</b><small>@you</small></div></div>
</aside>
<main class="main" id="main"></main>
</div>

<div class="overlay" id="create" style="display:none">
<div class="modal">
<div class="modalhead"><h2>Create post</h2><button class="close" onclick="closeCreate()">✕</button></div>
<div class="createuser"><div class="avatar">Y</div><div><b>You</b><span>@you</span></div></div>
<textarea id="postInput" placeholder="What's on your mind?"></textarea>
<button class="publish" onclick="addPost()">Post</button>
</div>
</div>

<div class="overlay" id="aimodal" style="display:none">
<div class="modal">
<div class="modalhead"><h2>✨ Nexa AI</h2><button class="close" onclick="closeAI()">✕</button></div>
<div class="aiMessages" id="aiMessages"><div class="aib ai">Hey! I'm Nexa AI. How can I help you?</div></div>
<div class="aiinput"><input id="aiInput" placeholder="Ask Nexa AI..." onkeydown="if(event.key==='Enter')askAI()"><button onclick="askAI()">➤</button></div>
</div>
</div>

<script>
let posts=[
{id:1,name:"Alex",user:"@alex",avatar:"A",time:"2h",text:"Welcome to NexaLoop 🚀",likes:128,comments:24,liked:false},
{id:2,name:"Sarah",user:"@sarah",avatar:"S",time:"4h",text:"The future of social media starts here.",likes:342,comments:41,liked:false,image:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=80"},
{id:3,name:"Jordan",user:"@jordan",avatar:"J",time:"6h",text:"What are you all doing today?",likes:76,comments:13,liked:false}
];
let chats=[{id:1,name:"Sarah",avatar:"S",last:"That sounds awesome!",online:true},{id:2,name:"Alex",avatar:"A",last:"See you tomorrow",online:false},{id:3,name:"Jordan",avatar:"J",last:"🔥🔥🔥",online:true}];
let currentChat=null;

function page(p){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
let n=document.getElementById("n-"+p);if(n)n.classList.add("active");
if(p==="flow")flow();if(p==="search")search();if(p==="messages")messages();if(p==="notifications")notifications();if(p==="saved")saved();if(p==="profile")profile();if(p==="settings")settings();
}
function flow(){
let h=`<div class="top"><div><h1>Flow</h1><p>What's happening on NexaLoop</p></div></div>
<div class="stories"><div class="story"><div class="circle">＋</div>Your story</div>${["Sarah","Alex","Jordan","Mia","Chris"].map(x=>`<div class="story"><div class="circle g">${x[0]}</div>${x}</div>`).join("")}</div>
<div class="composer" onclick="openCreate()"><div class="avatar">Y</div><div>What's on your mind?</div>📷</div>`;
posts.forEach(p=>h+=`<article class="post"><div class="posthead"><div class="avatar">${p.avatar}</div><div class="postuser"><b>${p.name}</b><span>${p.user} · ${p.time}</span></div><span>•••</span></div><p class="posttext">${esc(p.text)}</p>${p.image?`<img class="postimg" src="${p.image}">`:""}<div class="stats"><span>${p.likes} likes</span><span>${p.comments} comments</span></div><div class="actions"><button class="${p.liked?"liked":""}" onclick="like(${p.id})">${p.liked?"♥":"♡"} Like</button><button onclick="comment(${p.id})">💬 Comment</button><button onclick="share(${p.id})">↗ Share</button></div></article>`);
document.getElementById("main").innerHTML=h;
}
function like(id){let p=posts.find(x=>x.id===id);p.liked=!p.liked;p.likes+=p.liked?1:-1;flow()}
function comment(id){let x=prompt("Write a comment:");if(x){posts.find(p=>p.id===id).comments++;flow()}}
function share(id){navigator.clipboard?.writeText(posts.find(p=>p.id===id).text);alert("Post shared!")}
function search(){document.getElementById("main").innerHTML=`<div class="page"><h1>Search</h1><div class="search">🔎 <input id="q" placeholder="Search NexaLoop..." oninput="people()"></div><div id="results"></div></div>`;people()}
function people(){let q=(document.getElementById("q")?.value||"").toLowerCase();let a=["Sarah","Alex","Jordan","Mia","Chris","Taylor","Avery"].filter(x=>x.toLowerCase().includes(q));document.getElementById("results").innerHTML=a.map(x=>`<div class="result"><div class="avatar">${x[0]}</div><div class="info"><b>${x}</b><span>@${x.toLowerCase()}</span></div><button class="follow" onclick="this.innerText=this.innerText==='Follow'?'Following':'Follow'">Follow</button></div>`).join("")}
function messages(){document.getElementById("main").innerHTML=`<div class="messages"><div class="list"><h2>Nexa-Link</h2>${chats.map(c=>`<button class="conversation ${currentChat===c.id?"selected":""}" onclick="chat(${c.id})"><div class="avatar">${c.avatar}</div><div><b>${c.name}</b><span>${c.last}</span></div></button>`).join("")}</div><div class="chat">${currentChat?chatHTML():'<div class="empty"><h2>Nexa-Link</h2><p>Select a conversation to start messaging.</p></div>'}</div></div>`}
function chat(id){currentChat=id;messages()}
function chatHTML(){let c=chats.find(x=>x.id===currentChat);return`<div class="chathead"><div class="avatar">${c.avatar}</div><div><b>${c.name}</b><span>${c.online?"Active now":"Offline"}</span></div></div><div class="chatbody"><div class="bubble received">Hey! Welcome to Nexa-Link 👋</div><div class="bubble sent">Thanks! This app is awesome.</div><div class="bubble received">${c.last}</div></div><div class="chatinput"><input id="msg" placeholder="Message..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>`}
function send(){let x=document.getElementById("msg");if(x&&x.value.trim()){alert("Message sent!");x.value=""}}
function notifications(){document.getElementById("main").innerHTML=`<div class="page"><h1>Notifications</h1>${[["Sarah","liked your post","2m"],["Alex","started following you","12m"],["Jordan","commented on your post","1h"],["Mia","mentioned you in a post","3h"]].map(n=>`<div class="notice"><div class="avatar">${n[0][0]}</div><div class="info"><b>${n[0]}</b> ${n[1]}<span>${n[2]}</span></div>♥</div>`).join("")}</div>`}
function saved(){document.getElementById("main").innerHTML=`<div class="page"><h1>Saved</h1><div class="empty"><h2>🔖 Nothing saved yet</h2><p>Posts you save will appear here.</p></div></div>`}
function profile(){document.getElementById("main").innerHTML=`<div class="cover"></div><div class="profile"><div class="profilepic">Y</div><button class="edit">Edit Profile</button><h1>You</h1><p class="muted">@you</p><p class="bio">Welcome to my NexaLoop profile 🚀</p><div class="stats2"><div><b>124</b><span>Following</span></div><div><b>842</b><span>Followers</span></div><div><b>${posts.length}</b><span>Posts</span></div></div></div><div class="tabs"><button>Posts</button><button>Replies</button><button>Media</button></div><div class="empty"><h2>Your NexaLoop</h2><p>Your posts will appear here.</p></div>`}
function settings(){document.getElementById("main").innerHTML=`<div class="page"><h1>Settings</h1>${[["Account","Manage your account information"],["Privacy","Control who can see your content"],["Notifications","Manage notification preferences"],["Appearance","Customize your NexaLoop experience"],["Security","Password and security settings"]].map(s=>`<button class="setting"><div><b>${s[0]}</b><span>${s[1]}</span></div>›</button>`).join("")}<button class="logout" onclick="alert('Logged out!')">Log out</button></div>`}
function openCreate(){document.getElementById("create").style.display="grid";document.getElementById("postInput").focus()}
function closeCreate(){document.getElementById("create").style.display="none"}
function addPost(){let x=document.getElementById("postInput"),t=x.value.trim();if(!t)return alert("Write something first.");posts.unshift({id:Date.now(),name:"You",user:"@you",avatar:"Y",time:"now",text:t,likes:0,comments:0,liked:false});x.value="";closeCreate();page("flow")}
function openAI(){document.getElementById("aimodal").style.display="grid"}
function closeAI(){document.getElementById("aimodal").style.display="none"}
function askAI(){let i=document.getElementById("aiInput"),t=i.value.trim();if(!t)return;let m=document.getElementById("aiMessages");m.innerHTML+=`<div class="aib you">${esc(t)}</div><div class="aib ai">I'm Nexa AI! Connect an AI API to make me fully conversational. 🚀</div>`;i.value="";m.scrollTop=m.scrollHeight}
function esc(t){let d=document.createElement("div");d.textContent=t;return d.innerHTML}
flow();
</script>
</body>
</html>
